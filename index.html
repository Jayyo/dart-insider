<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DART Insider Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Roboto+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #0e1420;
            --bg-panel: #12182a;
            --border: #1a2438;
            --border-highlight: #2a3f5f;

            --text-primary: #e0e6f0;
            --text-secondary: #8b96a8;
            --text-dim: #5a6478;

            --accent-cyan: #00d9ff;
            --accent-green: #00ff88;
            --accent-orange: #ff9500;
            --accent-red: #ff3b5c;

            --glow-cyan: 0 0 20px rgba(0, 217, 255, 0.4);
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.4);

            --font-display: 'Orbitron', monospace;
            --font-mono: 'Roboto Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(90deg, var(--border) 1px, transparent 1px),
                linear-gradient(0deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* Top Command Bar */
        .command-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 15, 26, 0.95);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: var(--glow-cyan);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }

        .status-pills {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .pill {
            padding: 6px 14px;
            background: var(--bg-panel);
            border: 1px solid var(--border-highlight);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: var(--glow-green);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        /* Main Container - Split Layout */
        .main-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 0;
            height: calc(100vh - 60px);
            position: relative;
        }

        /* Left Sidebar - Live Feed */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-highlight);
        }

        .sidebar-header h2 {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 16px;
        }

        .quick-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-highlight);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        /* Transaction Feed */
        .transaction-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .transaction-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent-green);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .transaction-card:hover {
            border-left-color: var(--accent-cyan);
            transform: translateX(4px);
            box-shadow: -4px 0 20px rgba(0, 217, 255, 0.2);
        }

        .transaction-card.selected {
            background: rgba(0, 217, 255, 0.05);
            border-color: var(--accent-cyan);
            border-left-width: 4px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .card-company {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-exec {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .card-amount {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-green);
            text-align: right;
        }

        .card-amount-label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .meta-item {
            font-size: 10px;
            color: var(--text-dim);
        }

        .meta-item strong {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .market-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .market-badge.kospi {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .market-badge.kosdaq {
            background: rgba(0, 217, 255, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 217, 255, 0.3);
        }

        /* Right Panel - Analytics Dashboard */
        .dashboard {
            padding: 24px;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .chart-title {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
        }

        .chart-container {
            height: 280px;
            position: relative;
        }

        /* Detail Panel */
        .detail-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-highlight);
            border-radius: 8px;
            padding: 24px;
            margin-top: 24px;
            display: none;
        }

        .detail-panel.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-highlight);
        }

        .detail-header h3 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-detail {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
        }

        .close-detail:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-item {
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            border-left: 2px solid var(--accent-cyan);
        }

        .detail-item-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .detail-item-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .detail-reason {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid var(--border-highlight);
            border-radius: 6px;
            padding: 16px;
        }

        .detail-reason h4 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            margin-bottom: 10px;
        }

        .detail-reason p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 26, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: var(--font-display);
            font-size: 14px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-highlight);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                border-right: none;
                border-bottom: 2px solid var(--border);
                max-height: 50vh;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">Initializing Terminal...</div>
        </div>
    </div>

    <!-- Command Bar -->
    <div class="command-bar">
        <div class="logo">DART INSIDER</div>
        <div class="status-pills">
            <div class="pill">
                <span class="dot"></span>
                <span>LIVE</span>
            </div>
            <div class="pill" id="recordCount">0 Records</div>
            <div class="pill" id="lastUpdate">Standby</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar - Transaction Feed -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Live Transactions</h2>
                <div class="quick-filters">
                    <button class="filter-btn active" onclick="setTimeRange('1w')">1W</button>
                    <button class="filter-btn" onclick="setTimeRange('1m')">1M</button>
                    <button class="filter-btn" onclick="setTimeRange('3m')">3M</button>
                    <button class="filter-btn" onclick="setTimeRange('all')">ALL</button>
                </div>
            </div>
            <div class="transaction-feed" id="transactionFeed">
                <!-- Transaction cards will be injected here -->
            </div>
        </div>

        <!-- Right Dashboard - Analytics -->
        <div class="dashboard">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Active Companies</div>
                    <div class="stat-value" id="statCompanies">-</div>
                    <div class="stat-sub">Participating firms</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Executives</div>
                    <div class="stat-value" id="statExecutives">-</div>
                    <div class="stat-sub">Insider traders</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Volume Purchased</div>
                    <div class="stat-value" id="statVolume">-</div>
                    <div class="stat-sub">Total shares</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Top Buyer</div>
                    <div class="stat-value" id="statTopBuyer" style="font-size: 18px;">-</div>
                    <div class="stat-sub" id="statTopBuyerSub">-</div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="charts-grid">
                <div class="chart-panel">
                    <div class="chart-header">
                        <div class="chart-title">Purchase Timeline</div>
                    </div>
                    <div class="chart-container">
                        <canvas id="timelineChart"></canvas>
                    </div>
                </div>
                <div class="chart-panel">
                    <div class="chart-header">
                        <div class="chart-title">Market Split</div>
                    </div>
                    <div class="chart-container">
                        <canvas id="marketChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Detail Panel (appears when transaction selected) -->
            <div class="detail-panel" id="detailPanel">
                <div class="detail-header">
                    <h3 id="detailTitle">Transaction Details</h3>
                    <button class="close-detail" onclick="closeDetail()">CLOSE</button>
                </div>
                <div class="detail-grid" id="detailGrid">
                    <!-- Details will be injected here -->
                </div>
                <div class="detail-reason">
                    <h4>Change Reason</h4>
                    <p id="detailReason">-</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentTimeRange = '1w';
        let selectedTransaction = null;
        let timelineChart, marketChart;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            loadData();
        });

        function initCharts() {
            const textColor = '#e0e6f0';
            const gridColor = 'rgba(26, 36, 56, 0.5)';

            // Timeline Chart
            const timelineCtx = document.getElementById('timelineChart').getContext('2d');
            timelineChart = new Chart(timelineCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Daily Purchases',
                        data: [],
                        borderColor: '#00d9ff',
                        backgroundColor: 'rgba(0, 217, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: '#00d9ff',
                        pointHoverBorderColor: '#fff',
                        pointHoverBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 400 },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(18, 24, 42, 0.95)',
                            titleColor: textColor,
                            bodyColor: '#8b96a8',
                            borderColor: '#2a3f5f',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            titleFont: { family: 'Roboto Mono', size: 12 },
                            bodyFont: { family: 'Roboto Mono', size: 11 }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: textColor, font: { family: 'Roboto Mono', size: 10 } }
                        },
                        y: {
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: textColor, font: { family: 'Roboto Mono', size: 10 } }
                        }
                    }
                }
            });

            // Market Chart
            const marketCtx = document.getElementById('marketChart').getContext('2d');
            marketChart = new Chart(marketCtx, {
                type: 'doughnut',
                data: {
                    labels: ['KOSPI', 'KOSDAQ', 'Other'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#00ff88', '#00d9ff', '#5a6478'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    animation: { duration: 400 },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: textColor,
                                padding: 16,
                                font: { family: 'Roboto Mono', size: 11 },
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(18, 24, 42, 0.95)',
                            titleColor: textColor,
                            bodyColor: '#8b96a8',
                            borderColor: '#2a3f5f',
                            borderWidth: 1,
                            padding: 12
                        }
                    }
                }
            });
        }

        async function loadData() {
            showLoading();

            try {
                const endDate = new Date();
                const startDate = new Date();
                startDate.setMonth(startDate.getMonth() - 3);

                const formatDate = (d) => d.toISOString().split('T')[0].replace(/-/g, '');
                const response = await fetch(`/api/purchases?start_date=${formatDate(startDate)}&end_date=${formatDate(endDate)}`);
                const result = await response.json();

                if (result.success && result.data) {
                    allData = result.data.map(item => ({
                        ...item,
                        timestamp: new Date(item.report_date)
                    }));

                    updateDashboard();
                    updateTransactionFeed();
                    updateCharts();

                    document.getElementById('lastUpdate').textContent = `Updated ${new Date().toLocaleTimeString()}`;
                }
            } catch (error) {
                console.error('Failed to load data:', error);
            } finally {
                hideLoading();
            }
        }

        function updateDashboard() {
            const companies = new Set(allData.map(d => d.corp_name)).size;
            const executives = allData.length;
            const totalShares = allData.reduce((sum, d) => sum + d.shares, 0);

            const companyShares = {};
            allData.forEach(d => {
                companyShares[d.corp_name] = (companyShares[d.corp_name] || 0) + d.shares;
            });
            const topBuyer = Object.entries(companyShares).sort((a, b) => b[1] - a[1])[0];

            document.getElementById('statCompanies').textContent = companies.toLocaleString();
            document.getElementById('statExecutives').textContent = executives.toLocaleString();
            document.getElementById('statVolume').textContent = formatNumber(totalShares);
            document.getElementById('recordCount').textContent = `${allData.length} Records`;

            if (topBuyer) {
                document.getElementById('statTopBuyer').textContent = topBuyer[0];
                document.getElementById('statTopBuyerSub').textContent = `${formatNumber(topBuyer[1])} shares`;
            }
        }

        function updateTransactionFeed() {
            const feed = document.getElementById('transactionFeed');
            const sorted = [...allData].sort((a, b) => b.timestamp - a.timestamp);

            feed.innerHTML = sorted.map(tx => {
                const marketClass = tx.market === '코스피' ? 'kospi' : tx.market === '코스닥' ? 'kosdaq' : '';
                return `
                    <div class="transaction-card" onclick="selectTransaction('${tx.rcept_no}')">
                        <div class="card-header">
                            <div>
                                <div class="card-company">${tx.corp_name}</div>
                                <div class="card-exec">${tx.exec_name} · ${tx.position}</div>
                            </div>
                            <div>
                                <div class="card-amount">${formatNumber(tx.shares)}</div>
                                <div class="card-amount-label">Shares</div>
                            </div>
                        </div>
                        <div class="card-meta">
                            <div class="meta-item">
                                <span class="market-badge ${marketClass}">${tx.market}</span>
                            </div>
                            <div class="meta-item"><strong>Code:</strong> ${tx.stock_code}</div>
                            <div class="meta-item"><strong>Stake:</strong> ${tx.rate}%</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateCharts() {
            // Timeline chart - group by date
            const dateGroups = {};
            allData.forEach(tx => {
                const date = tx.report_date;
                dateGroups[date] = (dateGroups[date] || 0) + 1;
            });

            const sortedDates = Object.keys(dateGroups).sort();
            timelineChart.data.labels = sortedDates.map(d => d.substring(5));
            timelineChart.data.datasets[0].data = sortedDates.map(d => dateGroups[d]);
            timelineChart.update();

            // Market chart
            const marketDist = { '코스피': 0, '코스닥': 0, '기타': 0 };
            allData.forEach(d => {
                if (d.market === '코스피') marketDist['코스피']++;
                else if (d.market === '코스닥') marketDist['코스닥']++;
                else marketDist['기타']++;
            });

            marketChart.data.datasets[0].data = [marketDist['코스피'], marketDist['코스닥'], marketDist['기타']];
            marketChart.update();
        }

        function selectTransaction(rceptNo) {
            const tx = allData.find(d => d.rcept_no === rceptNo);
            if (!tx) return;

            selectedTransaction = tx;

            // Highlight selected card
            document.querySelectorAll('.transaction-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            // Show detail panel
            document.getElementById('detailTitle').textContent = tx.corp_name;
            document.getElementById('detailGrid').innerHTML = `
                <div class="detail-item">
                    <div class="detail-item-label">Executive</div>
                    <div class="detail-item-value">${tx.exec_name}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Position</div>
                    <div class="detail-item-value">${tx.position}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Stock Code</div>
                    <div class="detail-item-value">${tx.stock_code}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Market</div>
                    <div class="detail-item-value">${tx.market}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Shares Purchased</div>
                    <div class="detail-item-value">${tx.shares.toLocaleString()}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Total Issued</div>
                    <div class="detail-item-value">${tx.total_shares ? tx.total_shares.toLocaleString() : '-'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Post-Transaction Stake</div>
                    <div class="detail-item-value">${tx.rate}%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Report Date</div>
                    <div class="detail-item-value">${tx.report_date}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-item-label">Receipt No</div>
                    <div class="detail-item-value">${tx.rcept_no}</div>
                </div>
            `;

            // Load reason if not already loaded
            if (!tx.reason) {
                loadReason(tx.rcept_no);
            } else {
                document.getElementById('detailReason').textContent = tx.reason;
            }

            document.getElementById('detailPanel').classList.add('active');
        }

        async function loadReason(rceptNo) {
            document.getElementById('detailReason').textContent = 'Loading...';
            try {
                const response = await fetch(`/api/report-reason?rcept_no=${rceptNo}`);
                const result = await response.json();
                const reason = result.reason || 'No reason provided';

                // Update in data
                const tx = allData.find(d => d.rcept_no === rceptNo);
                if (tx) tx.reason = reason;

                document.getElementById('detailReason').textContent = reason;
            } catch (error) {
                document.getElementById('detailReason').textContent = 'Failed to load';
            }
        }

        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('active');
            document.querySelectorAll('.transaction-card').forEach(card => {
                card.classList.remove('selected');
            });
        }

        function setTimeRange(range) {
            currentTimeRange = range;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            // TODO: Filter data by time range
        }

        function formatNumber(num) {
            if (num >= 100000000) return (num / 100000000).toFixed(1) + 'B';
            if (num >= 10000) return (num / 10000).toFixed(1) + 'K';
            return num.toLocaleString();
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
